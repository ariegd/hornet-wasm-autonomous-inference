name: Publish OCI Package to GHCR

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Instalar el compilador de Rust y el target WASI
      - name: Install Rust Toolchain & WASI Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      # 2. Compilar el binario Wasm dentro del runner
      - name: Build Wasm binary
        run: cargo build --target wasm32-wasip1 --release

      # 3. Autenticarse en GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Construir la imagen Docker empaquetando el .wasm generado y subirla a GHCR
      - name: Build and push Docker/Wasm Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:v1.0.0
