name: Factoría de Parches en Caliente (Edge Wasm CI/CD) 4

on:
  push:
    branches: [ "main", "master" ]  # Soportamos ambas ramas
  workflow_dispatch:

env:
  PROJECT_ID: ia-models-vm-hub
  GAR_LOCATION: europe-west1
  REPOSITORY: simulador-defensa-repo
  IMAGE_NAME: hornet-edge-ai

jobs:
  build-and-push-wasm:
    name: Compilar Binario Wasm y Empaquetar OCI
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout del Código
      uses: actions/checkout@v4

    - name: Instalar Rust Toolchain (Destino Wasm)
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-wasip1

    - name: Compilar Algoritmo de Inferencia a Wasm
      run: |
        cargo build --target wasm32-wasip1 --release

    - name: Configurar Herramientas OCI (Buildah)
      run: |
        sudo apt-get update
        sudo apt-get install -y buildah

    - name: Autenticación en Google Cloud (Workload Identity)
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/861671760827/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'mi-cuenta-servicio@ia-models-vm-hub.iam.gserviceaccount.com'

    - name: Configurar Docker / Credenciales de GCP
      uses: google-github-actions/setup-gcloud@v2

    - name: Autenticar en Google Artifact Registry
      run: |
        gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

    - name: Empaquetar Wasm en Contenedor OCI Ultra-Ligero
      run: |
        CONTAINER=$(buildah from scratch)
        buildah copy $CONTAINER target/wasm32-wasip1/release/*.wasm /handler.wasm
        buildah config --entrypoint '["/handler.wasm"]' $CONTAINER
        buildah config --annotation "module.wasm.image/variant=compat-smart" $CONTAINER
        buildah commit $CONTAINER ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

    - name: Desplegar Parche a Artifact Registry (Cloud Central)
      run: |
        buildah push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        buildah tag ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
        buildah push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
