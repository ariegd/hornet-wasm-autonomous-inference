[package]
name = "hornet-edge-ai"
version = "1.0.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"     # Optimización máxima para tamaño de binario mínimo
lto = true          # Link-Time Optimization
codegen-units = 1   # Minimiza paralelismo para compilar el binario más compacto
panic = "abort"     # Elimina código de desempaquetado de pánico
